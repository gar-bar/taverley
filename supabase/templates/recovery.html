<!doctype html>
<html lang="en">
  <body style="margin:0;background:#0f0d14;color:#f4eef7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;"><tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#1b1724;border-radius:18px;padding:32px;"><tr><td>
        <h1 style="margin:0 0 12px;font-size:28px;line-height:1.2;">Reset your Taverley password</h1>
        <p style="margin:0 0 24px;color:#a39bae;font-size:16px;line-height:1.5;">Enter this recovery code in the app to choose a new password.</p>
        <p style="margin:0 0 24px;padding:16px;background:#2e273b;border-radius:12px;color:#c48eff;font-size:30px;font-weight:700;letter-spacing:7px;text-align:center;">{{ .Token }}</p>
        <p style="margin:0;color:#a39bae;font-size:14px;line-height:1.5;">If you did not request a password reset, you can safely ignore this email.</p>
      </td></tr></table>
    </td></tr></table>
  </body>
</html>
